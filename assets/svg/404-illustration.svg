<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    .cup { transform-origin: 50% 90%; animation: float 4s ease-in-out infinite; }
    .steam { stroke-dasharray: 10; animation: steam-flow 2s linear infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-15px); } }
    @keyframes steam-flow { to { stroke-dashoffset: -20; } }
  </style>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text x="50%" y="50%" font-family="Poppins, sans-serif" font-size="150" font-weight="bold" fill="#E0E0E0" text-anchor="middle" dominant-baseline="middle">404</text>
  <g class="cup" transform="translate(260 100)">
    <path d="M40,50 C40,77.6 62.4,100 90,100 C117.6,100 140,77.6 140,50 L140,20 L40,20 Z" fill="#FFF" stroke="#DDD" stroke-width="4"/>
    <path d="M140,30 C151,30 160,39 160,50 C160,61 151,70 140,70" fill="none" stroke="#DDD" stroke-width="4"/>
    <rect x="50" y="30" width="80" height="10" fill="#D2B48C" rx="5"/>
    <g stroke="#C0C0C0" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
      <path class="steam" d="M70,15 Q80,-5 90,15" fill="none"/>
      <path class="steam" d="M100,15 Q110,-5 120,15" fill="none" style="animation-delay: 0.5s;"/>
    </g>
  </g>
</svg>